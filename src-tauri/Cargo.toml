[package]
name = "appproxybridge"
version = "0.6.4"

description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "appproxybridge"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }
windivert = { version = "0.6.0", features = ["vendored"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
windivert-sys = "0.10.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-single-instance = "2"

