name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v0.5.0:

            #### 📋 Группировка логов по процессам
            - **Интерактивный аккордеон:** В разделе системных логов добавлена вкладка «По процессам», где логи автоматически группируются по процессам операционной системы.
            - **Привязка к процессам:** Записи логов теперь содержат имя вызвавшего их процесса (например, `chrome.exe`, `telegram.exe`), что значительно упрощает отладку и мониторинг сетевой активности.
            - **Быстрая фильтрация:** Легко отслеживайте ошибки и предупреждения для конкретных приложений.

            #### ⚙️ Разделение настроек
            - **Выделенная страница настроек:** Настройки разделены на две логические вкладки:
              - **Настройки прокси:** управление пулом серверов и выбором основного подключения.
              - **Настройки приложения:** системные параметры (автозапуск, трей, DNS-проксирование, обход локальных адресов).
            - **Быстрый доступ из сайдбара:** Кнопки в сайдбаре позволяют мгновенно открыть соответствующую вкладку настроек.
            - **Перенос обновлений:** Кнопка ручной проверки обновлений и информация о версии перенесены в системные настройки приложения.

            #### 🔄 Динамический Changelog в интерфейсе
            - **История изменений:** В раздел настроек добавлена вкладка «История версий», которая подгружает подробное описание прошлых релизов напрямую через GitHub API.
            - **Отображение текущей версии:** Удобная визуализация текущей установленной версии приложения.

            #### 🛠️ Стабильность и база данных
            - **Миграции базы данных:** Внедрен механизм безопасной миграции структуры SQLite (добавление колонки `process_name` в таблицу логов).
            - **Сохранение данных:** Автоматическое обновление структуры БД при первом запуске новой версии без потери существующих правил маршрутизации и добавленных прокси-серверов.
          releaseDraft: false
          prerelease: false
