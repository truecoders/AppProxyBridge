name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v0.4.0:

            #### ⚡ Группировка процессов на дашборде
            - Все процессы автоматически распределяются на **4 группы**: Новые, Проксируются, Напрямую, Заблокированы.
            - При первом запуске все процессы попадают в группу «Новые».
            - Иконки быстрых действий (🔀 Проксировать / ➡️ Напрямую / 🔒 Заблокировать) с тултипами в каждой строке процесса.
            - Сворачиваемые секции с цветовой кодировкой и анимациями.
            - Назначения сохраняются в SQLite и синхронизируются с правилами маршрутизации движка в реальном времени.

            #### 📋 Системный лог в реальном времени
            - Новая вкладка «Лог» в сайдбаре с бейджем-счётчиком ошибок.
            - Терминальный стиль: моноширинный шрифт, тёмный фон, построчная разметка.
            - Цветовая кодировка уровней: ERROR (красный), WARN (жёлтый), INFO (синий).
            - Цветовая кодировка источников: relay, windivert, engine, system.
            - Доставка через Tauri Events — нулевая нагрузка CPU в покое, мгновенная доставка.
            - Хранение последних 300 записей в SQLite, кнопка очистки.

            #### 🗄️ Улучшения базы данных
            - Новая таблица `known_processes` — персистентная группировка процессов.
            - Новая таблица `app_logs` — системный лог с авто-тримом.
            - Авто-обнаружение процессов (INSERT OR IGNORE при каждом поллинге).

            #### 🔧 Улучшения бэкенда
            - Все `eprintln!` заменены на запись в БД + emit Tauri event.
            - `start_windivert_loop` и `start_tcp_relay` теперь принимают `db_path` для логирования.
            - `set_process_group` автоматически создаёт/обновляет правило маршрутизации.

            #### 📄 Обновлена документация
            - Полностью переписан README.md с актуальным описанием всех фич.
            - Добавлена схема БД, обновлена mermaid-диаграмма архитектуры.
          releaseDraft: false
          prerelease: false
