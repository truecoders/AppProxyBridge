name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v__VERSION__:

            #### 🎨 Премиальный дизайн Candy Glass / Cyber-Premium
            - **Стеклянный интерфейс:** Полностью обновлен визуальный стиль приложения на основе макетов Stitch. Добавлены современные панели (Glassmorphism) с глубоким размытием фона (`backdrop-filter: blur(25px)`).
            - **Неоновое оформление:** Реализована динамическая подсветка границ панелей и индикаторов с цветовым кодированием категорий трафика (Фиолетовый для новых, Бирюзовый для проксированных, Серый для прямого подключения, Красный для блокировок).
            - **Плавные анимации:** Добавлены эффекты наведения и индикации сетевой активности на строках процессов.

            #### ⚡ Оптимизация сетевого монитора
            - **Фильтрация TCP-соединений:** Теперь в список активных соединений включаются только реально установленные TCP-сессии (`dwState == MIB_TCP_STATE_ESTAB`). Неактивные и служебные сокеты исключены.
            - **Снижение нагрузки на CPU:** Удалено холостое сканирование UDP-таблиц системы, возвращавшее все слушающие UDP-порты. Это устранило проблему переполнения счетчика соединений (который зависал на значении 1000) и снизило потребление ресурсов при регулярном обновлении интерфейса.
          releaseDraft: false
          prerelease: false
