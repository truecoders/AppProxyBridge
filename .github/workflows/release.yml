name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v__VERSION__:
            
            #### 🛠 Исправления и улучшения стабильности (Аудит)
            - **Импорт:** Исправлены критические ошибки (крэш) при импорте правил и настроек маршрутизации.
            - **Автозапуск:** Устранена ошибка двойного автозапуска движка при включенном параметре "Запускать с системой", вызывавшая конфликт `WinDivert`.
            - **Оптимизация производительности:** Внедрена мемоизация обработки активных сетевых соединений (существенно снижает нагрузку на CPU).
            - **GitHub API:** Добавлена плавная обработка ошибки Rate Limit Exceeded (403). Вместо системной ошибки отображается дружелюбное предупреждение.
            - **UX/Интерфейс:** Исправлено отображение крошечных объемов трафика (меньше 1 КБ теперь отображается как байты, а не нули), а также добавлены системные разрешения для бесперебойного открытия диалоговых окон выбора файлов.
          releaseDraft: false
          prerelease: false
