name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v__VERSION__:
            - **Single Instance:** Реализована защита от повторного запуска нескольких экземпляров приложения (повторный запуск автоматически фокусирует текущее окно).
            - **Безопасный экспорт и импорт:** Добавлена строго изоляция команд резервного копирования `export_backup_file` и `import_backup_file` с валидацией расширения `.json`.
            - **Устранение переполнения стека в JS:** Исправлена ошибка `RangeError: Maximum call stack size exceeded` при экспорте больших резервных копий и логов.
            - **Оптимизация SQLite:** БД переведена на единый потокобезопасный пул подключаемых ресурсов, устраняя задержки и дисковые I/O блокировки на каждый запрос.
            - **Мгновенная остановка движка:** Реализован закрывающий вызов `WinDivertClose` при остановке сервиса, исключающий зависание потоков перехвата.
          releaseDraft: false
          prerelease: false

