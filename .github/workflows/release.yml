name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v__VERSION__:
            - **SOCKS5 UDP Associate:** Полноценная реализация перехвата и проксирования UDP DNS-запросов (RFC 1928) для предотвращения утечек DNS.
            - **Экспорт настроек:** Имя файла резервной копии по умолчанию автоматически формируется в формате `AppProxyBridgeBackup_YYYY-MM-DD.json`.
            - **GitHub API & Кэширование:** Добавлен автоматический фоллбэк на локальный кэш `localStorage` при превышении лимитов запросов к GitHub API (403 / 429).
          releaseDraft: false
          prerelease: false
