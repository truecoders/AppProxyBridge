name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v__VERSION__:
            - **Оптимизация логирования WinDivert:** Реализовано ограничение частоты логов (throttling) при ошибках сетевого стека и разрывах интернет-соединения (`HostUnreachable / Code 1232`).
            - **Улучшенная обработка рукопожатий:** Очищено и структурировано форматирование ошибок `HTTP CONNECT` при сбоях вышестоящих прокси-серверов (`502 Bad Gateway`).
          releaseDraft: false
          prerelease: false

