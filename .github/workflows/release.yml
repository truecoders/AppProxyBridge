name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v0.5.6:

            #### 🔍 Правила фильтрации по маске (Wildcards)
            - **Синтаксис шаблонов:** Добавлена полноценная поддержка подстановочных знаков (`*` и `?`) для сопоставления правил (например, `*chrome*` или `PID_*`), позволяющая гибко группировать и проксировать схожие процессы.

            #### ⚡ Наивысший приоритет автозапуска
            - **Планировщик Windows:** Приоритет задачи автозапуска в Task Scheduler повышен до максимального (`Priority 1`).
            - **Приоритет процесса:** При запуске приложение переводится в класс высокого приоритета (`HIGH_PRIORITY_CLASS`) для снижения сетевых задержек.

            #### 🛡️ Защита от утечки трафика (ранний запуск)
            - **Запуск в Rust:** WinDivert и Relay-серверы стартуют сразу на этапе инициализации Rust-бэкенда в Tauri, гарантируя мгновенный перехват пакетов еще до загрузки GUI.

            #### 🔄 Динамическая классификация процессов в UI
            - **Мгновенный переход:** Процессы автоматически перераспределяются по группам в UI (Проксируются / Напрямую / Блокируются) в реальном времени, если они соответствуют правилам по маске.

            #### 💡 Памятка о масках
            - **Инструкции:** Вкладка правил дополнена информационным блоком-инструкцией по синтаксису масок.
          releaseDraft: false
          prerelease: false
