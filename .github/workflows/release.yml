name: Release AppProxyBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install web dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # Uses package.json version
          releaseName: 'AppProxyBridge v__VERSION__'
          releaseBody: |
            🎉 Новый стабильный релиз AppProxyBridge v__VERSION__!
            
            ### 📦 Установка:
            Скачайте прикрепленный установщик ниже:
            - `.msi` — для стандартной тихой установки в систему.
            - `-setup.exe` — для автономного мастера установки.
            
            ### 🚀 Что нового в v0.4.5:

            #### 🔄 Встроенная система автообновлений (GitHub Releases)
            - **Автоматическая проверка на старте:** Приложение раз за сессию проверяет наличие новых версий на GitHub, чтобы не беспокоить пользователя частыми окнами.
            - **Ручная проверка в настройках:** Раздел настроек дополнен информацией о текущей версии и кнопкой принудительного поиска обновлений.
            - **Интегрированный UI:** Окно релиза во Fluent-дизайне, отображающее описание изменений (changelog) напрямую из GitHub.
            - **Прогресс загрузки в реальном времени:** Точный расчёт объема загружаемых данных в МБ и процентах с анимированным индикатором прогресса.
            - **Установка в один клик:** Загрузка и тихая установка происходят прямо внутри приложения без перехода в браузер. После установки приложение автоматически перезапускается.

            #### ⚙️ Улучшения бэкенда и CI/CD
            - **Нативный перезапуск:** Добавлена Rust-команда `restart_app` для безопасного перезапуска Tauri-приложения.
            - **Безопасность:** Интеграция `tauri-plugin-updater` с поддержкой цифровых подписей (Minisign) для проверки целостности обновлений перед установкой.
            - **Автоматическая сборка:** В GitHub Actions workflow добавлены переменные для сборки подписанных пакетов обновления.
          releaseDraft: false
          prerelease: false
